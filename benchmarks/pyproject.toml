[project]
name = "benchmarks"
version = "0.1.0"
description = "MATH-500, MMLU-Pro and LongBench runners with a pluggable model interface"
readme = "README.md"
authors = [
    { name = "Guanxu Zhou", email = "guanxu@student.ubc.ca" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=4",
    "huggingface-hub>=1.33.0",
    "jieba>=0.42.1",
    "math-verify[antlr4-13-2]>=0.9.0",
    "pillow>=12.3.0",
    "rouge>=1.0.1",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm",
    "transformers>=4.50",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "RunBenchmark"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
