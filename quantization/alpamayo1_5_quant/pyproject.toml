[project]
name = "alpamayo1_5-quant"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alpamayo1_5",  # inference models, action_space, geometry.rotation,  etc.
  "accelerate>=1.12.0",
  "av>=16.0.1",
  "colorlog",  # logging.py
  "einops>=0.8.1",
  "hydra-colorlog>=1.2.0",
  "hydra-core>=1.3.2",
  "pandas>=2.3.3",
  "physical-ai-av==0.2.0",
  "pillow>=12.0.0",
  "torch==2.9.1",
  "torchvision==0.24.1",
  "transformers==4.57.3",
  "flash-attn>=2.8.3",
  "matplotlib>=3.10.7",
  "seaborn>=0.13.2",
  "nvidia-modelopt==0.37.0",
  "tensorrt==10.14.1.48.post1",
  "tensorrt-llm==1.2.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Look one level up (recipes/) so setuptools finds alpamayo1_x_rl/ as a proper package.
# The editable install adds recipes/ to sys.path, making `alpamayo1_x_rl` importable
# from within this directory once the venv is active.
[tool.setuptools.packages.find]
where = [".."]
include = ["alpamayo1_5_quant*"]

[dependency-groups]
dev = [
  "mediapy>=1.2.4",
  "ipykernel>=6.29.3",
  "ipywidgets>=8.1.8",
  "pre-commit>=4.5.1",
  "pytest>=8.0.0",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
# tensorrt / tensorrt-llm only ship Linux wheels; the prebuilt flash-attn wheel is x86_64-only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# Prebuilt wheel matching torch 2.9 / cu12 / cxx11abi / cp312; update if torch changes.
flash-attn = { url = "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.9cxx11abiTRUE-cp312-cp312-linux_x86_64.whl" }
alpamayo1_5 = { path = "alpamayo1.5", editable = true }

[tool.alpamayo]
chat_template_version = "r1_5"

[tool.ruff]
line-length = 100
